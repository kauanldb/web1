<!DOCTYPE html>
<html>

<head>
    <title>FORMULÁRIO</title>
</head>

<body>
    <ul>
        <li>
            <a href="index.html">HOME</a>
        </li>
        <li>
            <a href="listas.html">LISTAS</a>
        </li>
        <li>
            <a href="tabela.html">TABELA</a>
        </li>
        <li>
            <a href="imagem.html">IMAGEM</a>
        </li>
    </ul>

    <h2>Conceitos sobre Formulário no HTML</h2>
    <p>Esta página possui um resumo sobre os conceitos de formulários do HTML!</p>

    <h2>Formulário</h2>

    <form>
        <div>
            <label for="nome">Nome: </label>
            <input type="text">
        </div>

        <br>

        <div>
            <label for="idade">Idade</label>
            <input type="number" min="0" max="120">
        </div>

        <br>

        <div>
            <label for="usuario">Usuário: </label>
            <input type="text">
        </div>

        <br>

        <div>
            <label for="senha">Senha: </label>
            <input type="password">
        </div>

        <br>

        <div>
            <label for="dataEvento">Data do Evento: </label>
            <input type="datetime-local">
        </div>
        <br>

        <div>
            <label for="">
                Telefone:
                <input type="tel" required placeholder="(XX)XXXXX-XXXX">
            </label>
        </div>
        <br>

        <div>
            <label for="email">
                E-mail: <input type="email" required>
            </label>
        </div>
        <br>

        <div>
            <label for="peso">
                Peso: <input type="number" min="0" max="200" step="0.25">
            </label>
        </div>
        <br>

        <div>
            <label for="volume">
                Volume: <input type="range" min="0" max="100" step="5">
            </label>
        </div>
        <br>

        <div>
            <fieldset>
                <legend>Estado Civil</legend>

                <p>
                    <label>
                        <input type="radio" name="est_civil" value="casado"> Casado:
                    </label>
                </p>

                <p>
                    <label>
                        <input type="radio" name="est_civil" value="solteiro"> Solteiro:
                    </label>
                </p>

                <p>
                    <label>
                        <input type="radio" name="est_civil" value="divorciado"> Divorciado:
                    </label>
                </p>
            </fieldset>
        </div>
        <br>

        <!--
            Produtos
        -->
        <div>
            <fieldset>
                <legend>Produtos</legend>
                <p>
                    <label>
                        <input type="checkbox" name="computador" value="Computador"> Computador
                    </label>
                </p>

                <p>
                    <label>
                        <input type="checkbox" name="computador" value="Monitor"> Monitor
                    </label>
                </p>
                <p>
                    <label>
                        <input type="checkbox" name="impressora" value="impressora"> Impressora
                    </label>
                </p>
            </fieldset>
        </div>
        <br>

        <div>
            <label>
                Deixe sua sugestão:<br>
                <textarea cols="30" rows="5"></textarea>
            </label>
        </div>
        <br>

        <div>
            <p>
                <label>
                    Site: <input type="url" list="sites" name="link">
                </label>
            </p>
            <datalist id="sites">
                <option label="Portal Unipam" value="https://portal.unipam.edu.br/"></option>

                <option label="Site UNIPAM" value="https://unipam.edu.br/"></option>

                <option label="Pos Unipam" value="https://pos.unipam.edu.br/"></option>
            </datalist>
        </div>
        <br>

        <div>
            <p>
                <label>
                    Carro:
                    <select name="carros" required>
                        
                        <optgroup label="1 Esportivos">
                        <option value="1.1">Ferrari</option>
                        <option value="1.2">Porche</option>
                        <option value="1.3">Lamborghini</option>
                        
                        <optgroup label="2 Popular">
                        <option value="2.1">Corsa</option>
                        <option value="2.2">Uno</option>
                        <option value="2.3">Gol</option>
                        <option value="2.4">Palio</option>

                    </select>
                </label>
            </p>
        </div>

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
