<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato - Catálogo Gamer</title>

    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    
    <link rel="stylesheet" href="style.css" />

    
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold logo" href="loja.html">
          <i class="fa-solid fa-gamepad"></i>
          CATÁLOGO GAMER
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="loja.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="categorias.html">Categorias</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="produtos.html">Produtos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contato.html">Contato</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    
    <section id="contato" class="container py-5" style="margin-top: 80px;">
      <div class="title">
        <h2>CONTATO</h2>
      </div>

      <form class="contact-form">
        <div class="row">
          <div class="col-md-6 mb-3">
            <input
              type="text"
              class="form-control"
              placeholder="Seu nome"
            />
          </div>

          <div class="col-md-6 mb-3">
            <input
              type="email"
              class="form-control"
              placeholder="Seu email"
            />
          </div>
        </div>

        <div class="mb-3">
          <textarea
            class="form-control"
            rows="5"
            placeholder="Sua mensagem"
          ></textarea>
        </div>

        <button class="btn btn-purple">ENVIAR MENSAGEM</button>
      </form>
    </section>

    
    <footer class="footer">
      <div class="container text-center">
        <h5>CATÁLOGO GAMER</h5>
        <p>© 2026 Todos os direitos reservados.</p>
      </div>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
